name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: curl --fail-with-body -sS "https://dcprixvsvnnuynyyyuah.supabase.co/rest/v1/_keepalive?select=id" -H "apikey:$SB_KEY" -H "Authorization:Bearer $SB_KEY"
